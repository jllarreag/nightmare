<section class="card stop" [class.risk]="stop().category === 'risk'">
  <h1 #heading tabindex="-1">
    {{ stop().category === 'risk' ? i18n.t('riskTitle') : i18n.t('stoppedTitle') }}
  </h1>
  <p class="lead">{{ stop().message }}</p>

  @if (stop().resources.length) {
    <ul class="resources">
      @for (resource of stop().resources; track resource.contact) {
        <li>
          <span>{{ resource.label }}</span>
          <a [href]="href(resource.contact)" rel="noopener" target="_blank">{{ resource.contact }}</a>
        </li>
      }
    </ul>
  }

  <button type="button" class="btn" (click)="store.reset()">{{ i18n.t('backToStart') }}</button>
</section>
